{k:'심판 용어',ko:'그만(마테)',jp:'待て Mate!',m:'한 팔을 어깨 높이로 수평으로 뻗어 손바닥을 기록석에 보입니다. 경기 일시 정지. 다시 시작할 땐 ‘하지메’를 외칩니다.',f:[[R,P(140,45,85,68)]],c:'손바닥을 펴 보임'},
{k:'심판 용어',ko:'그대로(소노마마)↔계속(요시)',jp:'そのまま / よし',m:'소노마마는 누워 겨루는 중 ‘자세 유지’(양 선수 몸에 손을 댐). 요시는 같은 동작으로 힘주어 눌러 ‘계속’을 뜻합니다. 소노마마는 누워서 겨루는 상황에서만 사용합니다.',f:[[R,[100,55,100,90,140,115,60,115,90,125,110,125]]],c:'두 선수를 손으로 터치'},
{k:'심판 용어',ko:'그만(경기 종료)',jp:'それまで 소레마데',m:'경기 종료 선언. 한판·절반승 한판·반칙패·기권승, 시간 종료, 골든스코어에서의 득점 시 외칩니다.',f:[[R,P(140,45,85,68)]],c:'경기 끝'},
{k:'심판 용어',ko:'승자 선언',jp:'勝ち 카치',m:'심판이 승자 쪽으로 한 손을 어깨 위로 올려 가리킵니다.',f:[[R,P(135,25,85,68)]],c:'승자를 가리킴'},
{k:'심판 용어',ko:'예',jp:'礼 레이',m:'경기 시작·끝에 서로 인사를 시키는 구령. 선수들은 왼발부터 한 걸음 나와 인사하고, 끝나면 오른발부터 물러나 인사합니다. 악수는 하지 않습니다.',f:[[T,[50,60,60,85,50,95,70,95,50,125,70,125]],[U,[150,60,140,85,150,95,130,95,130,125,150,125]]],c:'서로 인사'},
{k:'규칙',big:'4:00',ko:'경기 시간',jp:'試合時間',m:'성인·주니어·카뎃 모두 4분(실제 경기 시간, 마테 시 시계 정지). 경기 사이 휴식은 선수당 최소 10분.'},
{k:'규칙',big:'20초',ko:'누르기 시간',jp:'抑込時間',m:'20초=한판, 10~19초=절반, 5~9초=유효. 골든스코어에서는 5초면 유효가 되어 즉시 종료.'},
{k:'규칙',big:'3지도',ko:'반칙패',jp:'反則負 핫소쿠마케',m:'지도 3번째면 반칙패(상대는 한판승). 위험한 행위(예: 머리부터 떨어뜨리기 등)는 지도 없이 곧바로 반칙패(직접 반칙패)가 될 수 있습니다. 지도는 점수가 되지 않습니다.'},
{k:'규칙',big:'GS',ko:'골든스코어',jp:'ゴールデンスコア',m:'4분 안에 승부가 안 나면(점수 없음/동점) 휴식 없이 연장. 시간 제한이 없고 유효 이상 점수 또는 반칙패가 나오면 종료. 정규 시간의 지도 수는 연장에도 이어지지만, 정규 시간 동점이면 지도 수와 관계없이 연장에 들어갑니다.'},
{k:'규칙',big:'白·青',ko:'도복 색',jp:'柔道着',m:'심판 기준 왼쪽이 파란 도복, 오른쪽이 흰 도복. 띠는 엉덩이뼈 위로 단단히 매야 합니다. 마테 사이에 도복·머리를 정돈하지 않으면 지도입니다.'},
{k:'규칙',big:'4요소',ko:'한판 기준',jp:'一本の基準',m:'①속도 ②힘 ③등으로 떨어짐 ④끝까지 제어. 구르거나 멈추면 점수가 안 되고, 던진 뒤 브릿지(머리와 발로 버티기)는 위험해서 한판입니다.'},
{k:'규칙',big:'탭 2회',ko:'항복',jp:'参った 마이타',m:'손이나 발로 2회 이상 두드리거나 ‘마이타’라고 말하면 한판. 조르기·꺾기·누르기 어느 상황이든 가능하며, 실신해도 한판입니다.'},
{k:'규칙',big:'서서 ✕',ko:'서서 조르기·꺾기 금지',jp:'禁止技',m:'선 상태에서 조르기·꺾기를 시도하면 마테 후 지도. 허용 관절은 팔꿈치뿐. 다리 잡기, 가위 조르기(도지메), 카와즈가케 등은 금지 기술입니다.'},
{k:'규칙',big:'場外',ko:'경기장 밖',jp:'場外',m:'경기 구역에 한 발이라도 걸친 채 시작된 동작은 유효합니다. 두 선수 모두 밖으로 나가면 마테. 밖으로 나가는 지도는 소극적 행동에 부과됩니다.'},
{k:'규칙',big:'부전·기권',ko:'부전승·기권승',jp:'不戦勝 / 棄権勝',m:'후센가치=상대가 출전하지 않아 얻는 승리. 키켄가치=상대가 부상·기권으로 경기를 계속하지 못해 얻는 승리.'},
];
const RO=[['유도','judo'],['도복','judogi gi'],['띠','obi belt'],['다다미','tatami mat'],['경례','rei bow'],['예','rei bow'],['쿠미카타','kumikata kumi-kata grip'],['낙법','ukemi'],['쿠즈시','kuzushi'],['시작','hajime'],['마테','mate matte'],['그만','mate sore-made soremade'],['소노마마','sonomama sono-mama yoshi'],['한판','ippon'],['유효','yuko'],['절반','wazaari waza-ari awasete'],['지도','shido'],['업어치기','seoinage seoi-nage'],['허리후리기','haraigoshi harai-goshi'],['밭다리','osotogari osoto-gari'],['안뒤축','ouchigari ouchi-gari'],['허벅다리','uchimata uchi-mata'],['안다리','kouchigari kouchi-gari'],['어깨로','katagurumA kata-guruma'],['배대뒤치기','tomoenage tomoe-nage'],['누르기','osaekomi osaekomiwaza toketa'],['가로누르기','kesagatame kesa-gatame'],['조르기','shime waza shimewaza choke'],['꺾기','kansetsu waza kansetsuwaza armlock ambar'],['탭','tap maitta'],['항복','tap maitta'],['반칙패','hansokumake hansoku-make'],['골든','golden score gs'],['부전','fusen kiken'],['승자','kachi'],['도케타','toketa']];
D.forEach(d=>{let r='';RO.forEach(([k,v])=>{if((d.ko+d.jp).includes(k))r+=' '+v});d.s=(d.ko+' '+d.jp+' '+d.m+' '+d.k+' '+(d.c||'')+r).toLowerCase().replace(/[-_]/g,'')});
const cats=['전체',...new Set(D.map(d=>d.k))];let cat='전체';
function ln(a,c,w){return `<line x1="${a[0]}" y1="${a[1]}" x2="${a[2]}" y2="${a[3]}" stroke="${c}" stroke-width="${w||5}" stroke-linecap="round"/>`}
function fig(c,p,belt){const sx=(p[0]*.3+p[2]*.7),sy=(p[1]*.3+p[3]*.7)*0+p[1]+(p[3]-p[1])*.25;
 let s=`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="${c}"/>`+ln([p[0],p[1]+9,p[2],p[3]],c,8)+ln([sx,sy,p[4],p[5]],c,5)+ln([sx,sy,p[6],p[7]],c,5)+ln([p[2],p[3],p[8],p[9]],c,6)+ln([p[2],p[3],p[10],p[11]],c,6);
 if(belt)s+=`<rect x="${p[2]-8}" y="${p[3]-6}" width="16" height="5" fill="#111" rx="2"/>`;return s}
function svg(d){if(d.big)return `<svg viewBox="0 0 200 150" role="img" aria-label="${d.ko}"><rect width="200" height="150" fill="#14274e"/><text x="100" y="88" text-anchor="middle" font-size="${d.big.length>4?38:52}" font-weight="700" fill="#fbbf24">${d.big}</text><text x="100" y="125" text-anchor="middle" font-size="12" fill="#cbd5f0">${d.jp}</text></svg>`;
 let s=`<svg viewBox="0 0 200 150" role="img" aria-label="${d.ko} 개념도"><rect x="0" y="128" width="200" height="22" fill="#9bbf8a"/>`;
 (d.arrow||[]).forEach(a=>s+=`<defs><marker id="m${d.ko.length}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6z" fill="#f59e0b"/></marker></defs><line x1="${a[0]}" y1="${a[1]}" x2="${a[2]}" y2="${a[3]}" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5 3" marker-end="url(#m${d.ko.length})"/>`);
 d.f.forEach(([c,p])=>s+=fig(c,p,d.belt));
 if(d.arm)s+=`<path d="M52 100 L40 118" stroke="#f59e0b" stroke-width="3"/>`;
 return s+`<text x="100" y="144" text-anchor="middle" font-size="9" fill="#14274e">${d.c}</text></svg>`}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(t,q){t=esc(t);const ks=q.split(/\s+/).filter(Boolean).map(k=>esc(k).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));if(!ks.length)return t;return t.replace(new RegExp(ks.join('|'),'gi'),m=>`<mark>${m}</mark>`)}
function render(){const q=document.getElementById('q').value.trim().toLowerCase();
 const tk=q.replace(/[-_]/g,'').split(/\s+/).filter(Boolean);const r=D.filter(d=>(cat=='전체'||d.k==cat)&&tk.every(t=>d.s.includes(t)));
 document.getElementById('count').textContent=`${r.length}개 용어`;
 document.getElementById('list').innerHTML=r.length?r.map(d=>`<article class="card">${svg(d)}<div class="body"><span class="cat">${d.k}</span><h2>${hl(d.ko,q)}</h2><div class="jp">${hl(d.jp,q)}</div><p>${hl(d.m,q)}</p></div></article>`).join(''):'<div class="empty">검색 결과가 없습니다. 다른 단어로 찾아보세요.</div>'}
const tb=document.getElementById('tabs');
cats.forEach(c=>{const b=document.createElement('button');b.className='tab'+(c==cat?' on':'');b.textContent=c;b.onclick=()=>{cat=c;[...tb.children].forEach(x=>x.classList.toggle('on',x==b));render()};tb.appendChild(b)});
['input','keyup','change','search','compositionend'].forEach(e=>document.getElementById('q').addEventListener(e,render));render();
</script></body></html>
